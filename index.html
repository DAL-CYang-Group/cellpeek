<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CellPeek - DAL</title>
<link rel="stylesheet" href="static/uPlot.min.css">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#dde1e6; --text:#1d2329; --muted:#6b7480; --accent:#1f5fbf; }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.45 -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  #top { position:sticky; top:0; z-index:10; background:var(--card); border-bottom:1px solid var(--line); }
  header { padding:0 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:stretch; border-bottom:1px solid var(--line); }
  header > * { align-self:center; }
  header h1 { padding:10px 0; }
  #tabs { display:flex; gap:2px; align-self:stretch; margin-left:8px; }
  #tabs button { border:0; border-bottom:3px solid transparent; border-radius:0; background:none; padding:10px 14px 7px; color:var(--muted); font-weight:600; }
  #tabs button:hover { color:var(--text); background:#f3f5f8; }
  #tabs button.on { color:var(--accent); border-bottom-color:var(--accent); }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:8px 16px; background:#fafbfc; }
  .toolbar .sp { margin-left:auto; }
  .soon { margin:40px auto; max-width:560px; background:var(--card); border:1px dashed var(--line); border-radius:10px; padding:24px 28px; color:var(--muted); }
  .soon h2 { margin:0 0 6px; color:var(--text); font-size:17px; }
  header h1 { font-size:15px; margin:0 8px 0 0; white-space:nowrap; flex:none; }
  #hdrsp { margin-left:auto; }
  input[type=text], input[type=number], select { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:5px; background:#fff; }
  input[type=number] { width:64px; }
  #bc { width:400px; }
  button { font:inherit; padding:5px 12px; border:1px solid var(--line); border-radius:5px; background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  #msgrow { display:flex; flex-wrap:wrap; gap:4px 16px; padding:4px 16px 0; font-size:13px; }
  #status { color:var(--muted); }
  #status:empty { display:none; }
  #chips { display:flex; flex-wrap:wrap; gap:6px; padding:8px 16px 0; }
  #bcerr { color:#b00; }
  #bcerr:empty { display:none; }
  #modebar { display:flex; flex-wrap:wrap; gap:6px; padding:8px 16px 0; }
  #modebar button { border-radius:14px; padding:3px 11px; font-size:13px; color:var(--accent); border-color:var(--accent); background:#fff; }
  #modebar button.on { background:var(--accent); color:#fff; }
  .chip { display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:3px 8px 3px 4px; font-size:13px; }
  .chip input[type=color] { width:22px; height:22px; border:none; padding:0; background:none; cursor:pointer; }
  .chip .x { cursor:pointer; color:var(--muted); padding:0 2px; }
  .chip.err { border-color:#d33; color:#b00; }
  .chip select { font-size:11.5px; max-width:240px; padding:1px 3px; }
  .chip .meta { color:var(--muted); font-size:11.5px; }
  .chip .nm { cursor:pointer; font-size:12.5px; word-break:break-all; }
  .chip .nm:hover { color:var(--accent); text-decoration:underline; }
  .chip .nfile { color:var(--accent); font-size:11px; }
  #cellinfo { position:absolute; z-index:40; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 24px rgba(0,0,0,.15); padding:10px 12px; font-size:12.5px; max-width:min(640px, 94vw); }
  #cellinfo table { border-collapse:collapse; }
  #cellinfo td { padding:2px 8px 2px 0; vertical-align:top; }
  #cellinfo td:first-child { color:var(--muted); white-space:nowrap; }
  #cellinfo td.fn { word-break:break-all; font-weight:600; }
  #cellinfo select { font-size:12px; max-width:100%; }
  #findbar { padding-top:0; }
  #kw { width:400px; }
  #idx { font-size:12px; color:var(--muted); }
  #idx a { color:var(--accent); }
  #kwbox { margin:6px 16px 0; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  #kwbox .kh { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:6px 10px; border-bottom:1px solid var(--line); font-size:13px; }
  #kwbox .kh .sp { margin-left:auto; }
  #kwbox .kh button { padding:2px 10px; font-size:12.5px; }
  #kwlist { max-height:280px; overflow-y:auto; padding:4px 0; font-size:12.5px; }
  #kwlist label { display:flex; gap:8px; align-items:baseline; padding:2px 10px; cursor:pointer; }
  #kwlist label:hover { background:#f3f5f8; }
  #kwlist label.added { color:var(--muted); }
  #kwlist .nm { word-break:break-all; }
  #kwlist .dir { color:var(--muted); font-size:11px; margin-left:auto; white-space:nowrap; padding-left:8px; }
  #kwlist mark { background:#fff2a8; padding:0; }
  main { padding:10px 16px 40px; display:grid; gap:12px; }
  .mod { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px 10px; }
  .mod .bar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .mod .bar .t { font-weight:600; }
  .mod .opts { display:flex; flex-wrap:wrap; gap:10px; align-items:center; color:var(--muted); font-size:13px; }
  .mod.off { display:none; }
  .mod .plot { margin-top:6px; }
  .mod .note { color:var(--muted); font-size:12px; margin-top:4px; }
  .mod .opts .or { color:var(--muted); margin-left:4px; }
  .uplot { position:relative; }
  .lim { position:absolute; width:50px; height:19px; padding:0 2px; font-size:11px; font-family:inherit; color:var(--muted);
         background:#fff; border:1px solid transparent; border-radius:3px; z-index:5; }
  .lim:hover, .lim:focus { border-color:#9aa4b0; outline:none; color:var(--text); }
  .lim.set { color:var(--accent); font-weight:600; }
  .lim.r { text-align:right; }
  .axlab { position:absolute; font-size:12px; color:var(--text); white-space:nowrap; display:flex; align-items:center; gap:5px; z-index:4; }
  .axlab.y { writing-mode:vertical-rl; transform:rotate(180deg); }
  .axauto { position:absolute; z-index:6; font-size:10.5px; padding:0 5px; border-radius:8px; line-height:15px; color:var(--accent); border-color:var(--accent); background:#fff; }
  .axauto.set { background:var(--accent); color:#fff; }
  .expbtn { margin-left:auto; font-size:11.5px; padding:2px 9px; border-radius:10px; color:var(--accent); border-color:var(--accent); background:#fff; }
  .expbtn:hover { background:var(--accent); color:#fff; }
  .dq-cell .hrow { display:flex; align-items:center; gap:8px; }
  .dq-cell .hrow .head { flex:1; min-width:0; }
  #exp { border:1px solid var(--line); border-radius:10px; padding:0; width:min(1100px, 96vw); box-shadow:0 10px 40px rgba(0,0,0,.25); }
  #exp::backdrop { background:rgba(20,25,30,.35); }
  #exp .eh { display:flex; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); font-weight:600; }
  #exp .eh button { margin-left:auto; }
  #exp .eb { display:flex; flex-wrap:wrap; gap:14px; padding:12px 14px; }
  #exp .pv { flex:1 1 560px; min-width:300px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:6px; }
  #exp .pv canvas { width:100%; height:auto; display:block; }
  #exp .side { flex:0 1 330px; display:flex; flex-direction:column; gap:10px; font-size:13px; }
  #exp .side h4 { margin:0; font-size:12.5px; color:var(--muted); font-weight:600; }
  #exp .legrows { display:grid; grid-template-columns:auto 1fr; gap:4px 8px; align-items:center; max-height:330px; overflow:auto; }
  #exp .legrows input[type=color] { width:34px; height:24px; padding:0; border:1px solid var(--line); background:#fff; }
  #exp .legrows input[type=text] { width:100%; box-sizing:border-box; }
  #exp .ef { display:flex; align-items:center; gap:8px; padding:10px 14px; border-top:1px solid var(--line); }
  #exp .ef input { flex:1; }
  .dq-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap:10px; }
  .dq-cell .head { font-weight:600; font-size:13px; }
  .dq-cell .head { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dq-cell .head span { color:var(--muted); font-weight:400; font-size:11.5px; }
  .cyc-legend { font-size:11.5px; display:flex; flex-wrap:wrap; gap:2px 8px; margin-top:2px; }
  .dirty { box-shadow: inset 3px 0 0 #e8a33a; }
  .u-legend { display:none; }
  [hidden] { display:none !important; }
  header h1 a { color:inherit; text-decoration:none; }
  header h1 a:hover { color:var(--accent); text-decoration:underline; }
  #verlist .vh { font-weight:600; }
  #verlist .vh span { color:var(--muted); font-weight:400; margin-left:6px; }
  #verlist ul { margin:2px 0 0; padding-left:18px; }
  #src { font-size:12.5px; color:var(--muted); }
  #src a, #banner a { color:var(--accent); }
  #src a.srcneed { font-weight:600; color:#fff; background:var(--accent); padding:2px 8px; border-radius:4px; text-decoration:none; }
  #fbbtn { font-size:12.5px; padding:3px 10px; }
  #who { display:flex; align-items:center; gap:6px; font-size:12.5px; background:#eef3fb; border:1px solid #cfdcf0; border-radius:14px; padding:2px 6px 2px 10px; }
  #who a { color:var(--muted); text-decoration:none; font-size:13px; padding:0 3px; }
  #who a:hover { color:#b00; }
  #banner { background:#fff6e0; border-bottom:1px solid #f0d9a0; padding:6px 16px; font-size:13px; }
  #gate { position:fixed; inset:0; z-index:50; background:rgba(246,247,249,.97); display:flex; align-items:center; justify-content:center; padding:16px; }
  #gatecard { background:#fff; border:1px solid var(--line); border-radius:10px; padding:22px 26px; width:min(440px, 100%); box-shadow:0 8px 30px rgba(0,0,0,.08); display:flex; flex-direction:column; gap:10px; }
  #gatecard h2 { margin:0 0 4px; font-size:18px; }
  #gatecard p { margin:0; }
  #gatecard label { display:flex; flex-direction:column; gap:3px; font-size:13px; color:var(--muted); }
  #gatecard input { font-size:14px; padding:6px 8px; }
  #gatecard code { background:#f1f3f6; padding:1px 5px; border-radius:4px; }
  .gerr { color:#b00; font-size:13px; min-height:1px; }
  .gmuted { color:var(--muted); font-size:12.5px; }
  dialog.small { border:1px solid var(--line); border-radius:10px; padding:0; width:min(480px, 94vw); box-shadow:0 10px 40px rgba(0,0,0,.25); }
  dialog.small::backdrop { background:rgba(20,25,30,.35); }
  dialog.small .eh { display:flex; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); font-weight:600; }
  dialog.small .eh button { margin-left:auto; }
  dialog.small .sb { padding:12px 14px; display:flex; flex-direction:column; gap:10px; font-size:13px; }
  dialog.small .sb label { display:flex; flex-direction:column; gap:3px; }
  dialog.small .sb p { margin:0; }
  dialog.small textarea { font:inherit; padding:6px; border:1px solid var(--line); border-radius:5px; resize:vertical; }
  dialog.small .ef { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 14px; border-top:1px solid var(--line); }

  /* ---------- Raman tab ---------- */
  .rdrop { display:inline-flex; align-items:center; gap:12px; border:2px dashed #9fb4d6; border-radius:9px; padding:9px 22px 9px 16px; min-width:330px; color:var(--accent); background:#fff; cursor:pointer; font-size:13.5px; line-height:1.35; }
  .rdrop .ic { font-size:26px; line-height:1; }
  .rdrop:hover, .rdrop.over { background:#eef3fb; border-color:var(--accent); }
  .hbtns { display:inline-flex; gap:6px; align-items:center; }
  button.big { font-weight:700; padding:6px 16px; border:1.5px solid #e08a00; color:#b36b00; background:#fff7e8; }
  button.big:not(:disabled):hover { background:#e08a00; color:#fff; }
  #r_save { font-size:12.5px; } #r_save a { color:var(--accent); }
  #r_save a.srcneed { font-weight:600; color:#fff; background:var(--accent); padding:2px 8px; border-radius:4px; text-decoration:none; }
  #r_msg { padding:6px 16px 0; font-size:13px; color:var(--muted); min-height:6px; }
  .rgrid { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:12px; padding:8px 16px 40px; align-items:start; }
  @media (max-width: 1100px) { .rgrid { grid-template-columns:minmax(0, 1fr); } }
  .rgrid .mod, .rgrid .mod input, .rgrid .mod select, .rgrid .mod button { font-size:13px; }
  .rgrid .mod .bar { min-height:32px; flex-wrap:nowrap; } .rgrid .mod .bar .t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:60px; }
  .rgrid .mod .bar .opts { flex-wrap:nowrap; white-space:nowrap; } .rgrid .mod .bar button { white-space:nowrap; flex:none; }
  .rgrid .mod .bar .primary, .rgrid .mod .bar #ft_close { margin-left:auto; } .rgrid .mod .bar .expbtn { margin-left:0; font-size:11.5px; }
  .rgrid .mod .bar #ft_open[hidden] + .expbtn { margin-left:auto; }
  .rgrid label { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  .rgrid .mod canvas { display:block; touch-action:none; }
  .rgrid .mod .lim, .rgrid .mod .axauto { font-size:11px; }
  .hintrow { margin-top:6px; padding:4px 10px; font-size:12.5px; color:var(--muted); border:1px solid transparent; border-radius:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hintrow.hint { background:#fff8e1; border-color:#f0d9a0; color:var(--text); }
  #wf_list { margin-top:8px; border-top:1px solid var(--line); padding-top:6px; max-height:190px; overflow:auto; }
  #wf_list .empty { color:var(--muted); padding:8px 2px; }
  .srow { display:flex; align-items:center; gap:6px; padding:3px 6px; border-radius:6px; cursor:pointer; }
  .srow:hover { background:#f3f5f8; } .srow.on { background:#eef3fb; font-weight:600; }
  .srow input[type=color] { width:20px; height:20px; border:none; padding:0; background:none; cursor:pointer; }
  .srow .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .srow .ed { color:var(--muted); cursor:pointer; visibility:hidden; padding:0 2px; } .srow:hover .ed { visibility:visible; } .srow .ed:hover { color:var(--accent); }
  .srow input.nmedit { flex:1; min-width:0; padding:1px 4px; }
  .srow .meta { color:var(--muted); font-size:11.5px; font-weight:400; white-space:nowrap; } .srow .x { color:var(--muted); padding:0 3px; }
  .pre { margin-top:8px; border-top:1px solid var(--line); padding-top:8px; display:flex; flex-direction:column; gap:6px; }
  .pre .ph { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prow { display:flex; flex-wrap:nowrap; align-items:center; gap:10px; min-height:30px; white-space:nowrap; overflow:hidden; }
  .rgrid .mod .prow button.tg { width:108px; flex:none; font-weight:600; padding:5px 0; }
  .rgrid .mod .prow button.tg.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .rgrid .mod .prow button.tg.pick { background:#fff3d6; border-color:#e0a800; }
  .prow a { color:var(--accent); }
  .side { margin-top:8px; border-top:1px solid var(--line); padding-top:8px; }
  .r2 { padding:0 2px 6px; } .r2 b { font-weight:700; }
  table.pk { border-collapse:collapse; width:100%; }
  table.pk th { text-align:left; font-weight:600; color:var(--muted); font-size:12px; padding:3px 4px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.pk td { padding:3px 4px; border-bottom:1px solid #f0f2f4; white-space:nowrap; vertical-align:middle; } table.pk tr.on td { background:#eef3fb; }
  table.pk input[type=number] { width:76px; padding:3px 5px; } table.pk input.nm { width:110px; padding:3px 5px; }
  table.pk input[data-f=eta] { width:60px; }
  table.pk input.lk { border-color:#e0c46c; background:#fffbea; }
  table.pk td.ro { font-variant-numeric:tabular-nums; } table.pk .sw { display:inline-block; width:10px; height:10px; border-radius:2px; }
  table.pk .ef { display:inline; } table.pk .ef input { margin:0 0 0 4px; vertical-align:-2px; }
  table.pk .x { cursor:pointer; color:var(--muted); }
  .ratios { margin-top:10px; } .ratios .rh { display:flex; align-items:center; gap:8px; font-weight:600; color:var(--muted); }
  .ratios .rh button { padding:1px 8px; }
  .ratio { border:1px solid var(--line); border-radius:7px; padding:6px 8px; margin-top:6px; }
  .ratio .rv { display:flex; align-items:baseline; gap:8px; } .ratio .rv b { margin-left:auto; } .ratio .x { cursor:pointer; color:var(--muted); }
  .frac { display:flex; flex-direction:column; gap:3px; margin-top:4px; } .frac .nr { border-bottom:1.5px solid var(--text); padding-bottom:3px; }
  .frac > div { display:flex; flex-wrap:wrap; gap:4px; }
  .rgrid .mod .pill { font-size:11.5px; padding:1px 8px; border-radius:10px; border:1px solid var(--c); color:var(--c); background:#fff; }
  .rgrid .mod .pill.on { background:var(--c); color:#fff; }
  .hrow { display:flex; gap:8px; padding:3px 6px; border-radius:5px; cursor:pointer; } .hrow:hover { background:#f3f5f8; }
  .hrow.on { background:#eef3fb; font-weight:600; } .hrow.fut { color:var(--muted); }
</style>
</head>
<body>
<div id="top">
<header>
  <h1>CellPeek - DAL <span style="font-weight:400;color:#6b7480;font-size:12px"><a href="#" id="ver" title="Version history">beta 0.2.1</a> · by <a href="https://www.yang-dal.com/" target="_blank" rel="noopener">Chongyin Yang</a></span></h1>
  <nav id="tabs" role="tablist">
    <button type="button" role="tab" data-tab="neware">Neware Cycling</button>
    <button type="button" role="tab" data-tab="raman">Raman Fitting</button>
  </nav>
  <span id="hdrsp"></span>
  <button id="fbbtn" hidden title="Report a bug or send a suggestion">Feedback</button>
  <span id="who" hidden></span>
</header>
<div class="toolbar" data-pane="neware">
  <input id="bc" type="text" placeholder="e.g. 1169067, 1169068  or a range 1172140-1172160, then Enter" title="Separate barcodes with spaces, commas or ;  ·  a range: 1172140-1172160 (or 1172140-160), spaces allowed">
  <button id="add">Add</button>
  <button id="plot" class="primary">Plot</button>
  <span class="sp"></span>
  <span id="src" hidden></span>
</div>
<div class="toolbar" data-pane="neware" id="findbar">
  <input id="kw" type="text" placeholder="Search file names: name CYY, temperature 40C, voltage 42V …" title="Type any words from the file name, e.g. the name abbreviation (CYY), temperature (40C), voltage (42V), date (261021). All words must appear, in any order; upper/lower case ignored.">
  <label title="Also search the other NEWARE... folders (slow the first time they are read)"><input type="checkbox" id="kwall"> all NEWARE folders</label>
  <span class="sp"></span>
  <span id="idx"></span>
</div>
<div class="toolbar" data-pane="raman" hidden>
</div>
</div>
<div id="banner" hidden></div>
<div id="gate" hidden><div id="gatecard"></div></div>
<section data-pane="neware">
<div id="kwbox" hidden>
  <div class="kh"><span id="kwn"></span><span class="sp"></span>
    <button type="button" id="kwselall">Select all</button><button type="button" id="kwnone">Clear</button>
    <button type="button" id="kwadd" class="primary">Add selected</button><button type="button" id="kwclose" title="Close">✕</button></div>
  <div id="kwlist"></div>
</div>
<div id="chips"></div>
<div id="msgrow"><span id="status"></span><span id="bcerr"></span></div>
<div id="modebar"></div>
<main id="mods"></main>
</section>
<section data-pane="raman" hidden>
</section>

<script src="static/uPlot.iife.min.js"></script>
<script src="config.js?v=0.2.3"></script>
<script src="versions.js?v=0.2.3"></script>
<script src="data.js?v=0.2.3"></script>
<script src="auth.js?v=0.2.3"></script>
<script src="raman.js?v=0.2.3"></script>
<dialog id="verdlg" class="small">
  <div class="eh"><span>Version history</span><button type="button" id="ver_x">✕</button></div>
  <div class="sb" id="verlist"></div>
</dialog>
<dialog id="fb" class="small">
  <div class="eh"><span>Feedback</span><button type="button" id="fb_x">✕</button></div>
  <div class="sb">
    <label>Type <select id="fb_type"><option>Bug</option><option>Suggestion</option><option>Other</option></select></label>
    <textarea id="fb_text" rows="6" placeholder="What happened, or what would help? Barcodes and settings are attached automatically."></textarea>
    <label>Screenshot (optional) <input type="file" id="fb_img" accept="image/*"></label>
    <div id="fb_msg" class="gerr"></div>
  </div>
  <div class="ef"><span class="gmuted">Sent to Chongyin Yang</span><button type="button" class="primary" id="fb_go">Send</button></div>
</dialog>
<dialog id="rmt" class="small">
  <div class="eh"><span>Data source (super users)</span><button type="button" id="rm_x">✕</button></div>
  <div class="sb">

<script>

(function () {
  const tabs = document.querySelectorAll('#tabs [data-tab]');
  function show(t) {
    if (![...tabs].some(b => b.dataset.tab === t)) t = 'neware';
    tabs.forEach(b => { b.classList.toggle('on', b.dataset.tab === t); b.setAttribute('aria-selected', b.dataset.tab === t); });
    document.querySelectorAll('[data-pane]').forEach(p => p.hidden = p.dataset.pane !== t);
    try { localStorage.setItem('nqp_tab', t); } catch {}
    if (location.hash !== '#' + t) history.replaceState(null, '', '#' + t);
    window.dispatchEvent(new Event('resize'));          // plots drawn while hidden get their width back
    window.dispatchEvent(new Event('cellpeek:tab'));
  }
  tabs.forEach(b => b.onclick = () => show(b.dataset.tab));
  let saved = ''; try { saved = localStorage.getItem('nqp_tab') || ''; } catch {}
  show(location.hash.slice(1) || saved);
})();

<script>
"use strict";
// api(path) comes from data.js (local folder, remote server or server.py)
// one tokenizer for every list input (barcodes, cycles, ...): tab, any number of spaces, comma, semicolon (incl. full-width)
const splitTokens = (t) => String(t || '').split(/[\s,;，；、]+/).map(x => x.trim()).filter(Boolean);
// cycle list: "1, 2; 9 50" or ranges "10-20"; returns {ks, bad}
function parseCycles(t) {
  const ks = [], bad = [];
  for (const tok of splitTokens(t)) {
    let m;
    if (/^\d+$/.test(tok)) ks.push(+tok);
    else if ((m = tok.match(/^(\d+)\s*[-–~]\s*(\d+)$/))) { const a = +m[1], b = +m[2]; for (let k = Math.min(a, b); k <= Math.max(a, b) && ks.length < 500; k++) ks.push(k); }
    else bad.push(tok);
  }
  return {ks: [...new Set(ks)].sort((a, b) => a - b), bad};
}
const PALETTE = ['#1f5fbf','#d62728','#2ca02c','#ff7f0e','#9467bd','#8c564b','#e377c2','#17becf','#7f7f7f','#bcbd22'];
const $ = (s, el=document) => el.querySelector(s);
const status = (t) => { $('#status').textContent = t; };

// ---------------- state ----------------
const cells = [];            // {bc, color, file, candidates, data, err}
const vqCache = {};          // bc|file -> {k: {chg:[Q,V], dis:[Q,V]}}
const rendered = {};         // modId -> {sig, plots:[]}

// ---------------- modules ----------------
const M = [
  {id:'qcyc',  title:'Discharge capacity vs cycle',        x:'cyc',  y:'q',  opts:['unit']},
  {id:'qtime', title:'Discharge capacity vs time',        x:'time', y:'q',  opts:['unit']},
  {id:'ncyc',  title:'Normalized discharge capacity vs cycle',  x:'cyc',  y:'n',  opts:['ref']},
  {id:'ntime', title:'Normalized discharge capacity vs time',  x:'time', y:'n',  opts:['ref']},
  {id:'cecyc', title:'Coulombic efficiency vs cycle',        x:'cyc',  y:'ce', opts:[]},
  {id:'cetime',title:'Coulombic efficiency vs time',        x:'time', y:'ce', opts:[]},
  {id:'dvcyc', title:'ΔV vs cycle',              x:'cyc',  y:'dv', opts:['dvmode']},
  {id:'dvtime',title:'ΔV vs time',              x:'time', y:'dv', opts:['dvmode']},
  {id:'dqdv',  title:'dQ/dV',                   x:'v',    y:'dq', opts:['cycsel','smooth']},
];
const OPT_HTML = {
  unit:   `Unit <select data-k="unit"><option value="g">mAh/g</option><option value="mAh">mAh</option></select>`,
  ref:    `Normalize to cycle <input type="number" data-k="ref" value="1" min="1">`,
  dvmode: `<select data-k="dvmode"><option value="abs">ΔV (V)</option><option value="diff">ΔV − ΔV<sub>ref</sub> (mV)</option><option value="ratio">ΔV / ΔV<sub>ref</sub></option></select>
           ref cycle <input type="number" data-k="dvref" value="11" min="1">`,
  cycsel: `Cycles <input type="text" data-k="clist" value="" placeholder="e.g. 1, 2; 9  50  or 10-20" style="width:210px" title="Separate with tab, spaces, comma or ;  ·  a-b = every cycle from a to b  ·  leave empty to use the range">
           <span class="or">or every</span> <input type="number" data-k="cstep" value="5" min="1"> from <input type="number" data-k="c0" value="1" min="1"> to <input type="number" data-k="c1" value="50" min="1">`,
  smooth: `Smoothing <select data-k="smooth">
             <option value="raw">None (point-to-point)</option>
             <option value="5_3">Light: 5 mV grid + 3-pt</option>
             <option value="2.5_5" selected>Default: 2.5 mV grid + 5-pt</option>
             <option value="5_5">Heavy: 5 mV grid + 5-pt</option>
             <option value="10_3">Very heavy: 10 mV grid + 3-pt</option></select>`,
};
const DEFAULT_ON = {qcyc:true, ncyc:true, dvcyc:true, dqdv:true};
const ON = {...DEFAULT_ON};

function buildModules() {
  const box = $('#mods');
  for (const m of M) {
    const d = document.createElement('section');
    d.className = 'mod' + (DEFAULT_ON[m.id] ? '' : ' off'); d.id = 'mod-' + m.id;
    d.innerHTML = `<div class="bar"><span class="t">${m.title}</span>
      <div class="opts">${m.opts.map(o => OPT_HTML[o]).join('')}</div>${m.id === 'dqdv' ? '' : '<button type="button" class="expbtn" title="Export this plot as PNG">Export PNG</button>'}</div>
      <div class="plot"></div><div class="note"></div>`;
    box.appendChild(d);
    d.addEventListener('input', e => { if (e.target.closest('.uplot')) return; syncShow(d); markDirty(); });
    const eb = $('.expbtn', d); if (eb) eb.onclick = () => { const r = rendered[m.id]; if (r && r.plots[0]) openExport(r.plots[0]); else status('Plot first, then export'); };
    syncShow(d);

}
function buildModeBar() {
  const bar = $('#modebar');
  for (const m of M) {
    const b = document.createElement('button'); b.textContent = m.title; b.className = ON[m.id] ? 'on' : '';
    b.onclick = () => { ON[m.id] = !ON[m.id]; b.classList.toggle('on', !!ON[m.id]); $('#mod-' + m.id).classList.toggle('off', !ON[m.id]); markDirty(); };
    bar.appendChild(b);
  }
}
function syncShow(d) {
  const sel = $('[data-k=cycmode]', d); if (!sel) return;
  d.querySelectorAll('[data-show]').forEach(s => s.style.display = s.dataset.show === sel.value ? '' : 'none');
}
function settings(m) {
  const d = $('#mod-' + m.id), o = {};
  d.querySelectorAll('[data-k]').forEach(e => o[e.dataset.k] = e.type === 'checkbox' ? e.checked : e.value);
  return o;
}
function markDirty() {
  for (const m of M) $('#mod-' + m.id).classList.toggle('dirty', sigOf(m) !== (rendered[m.id] || {}).sig);
}

// ---------------- cells ----------------
function nextColor() { const used = new Set(cells.map(c => c.color)); return PALETTE.find(c => !used.has(c)) || '#' + Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0'); }
const bad = new Set();         // barcodes with a wrong format or not found
function showBad() {
  const e = $('#bcerr'); e.innerHTML = bad.size ? 'Barcode errors: ' + [...bad].join(', ') + ' <a href="#" style="margin-left:8px">clear</a>' : '';
  if (bad.size) $('a', e).onclick = (ev) => { ev.preventDefault(); bad.clear(); showBad(); };
}
// barcode list: "1169067, 1169068; 1169158" and ranges "1172140-1172160", "1172140 - 1172160", "1172140~160"
function parseBarcodes(text) {
  const t = String(text || '').replace(/(\d)\s*[-–—~～至到]+\s*(\d)/g, '$1-$2');
  const out = [], bad = [], ranged = new Set();
  for (const tok of splitTokens(t)) {
    let m;
    if (/^\d{4,9}$/.test(tok)) out.push(tok);
    else if ((m = tok.match(/^(\d{4,9})-(\d{1,9})$/))) {
      let a = m[1], b = m[2];
      if (b.length < a.length) b = a.slice(0, a.length - b.length) + b;      // 1172140-160 -> 1172160
      let x = +a, y = +b; if (y < x) [x, y] = [y, x];
      if (y - x > 300) { bad.push(`${tok} (range too long, max 300)`); continue; }
      for (let k = x; k <= y; k++) { const v = String(k).padStart(a.length, '0'); out.push(v); ranged.add(v); }
    } else bad.push(`${tok} (invalid)`);
  }
  return {bcs: [...new Set(out)], bad, ranged};
}
async function addCells(text) {
  const p = parseBarcodes(text);
  p.bad.forEach(b => bad.add(b));
  const bcs = p.bcs.filter(t => !cells.some(c => c.bc === t));
  showBad();
  for (const bc of bcs) {
    const c = {bc, color: nextColor(), file: null, candidates: [], data: null, err: null, loading: true, ranged: p.ranged.has(bc)};
    cells.push(c); loadCell(c);
  }
  renderChips();
}
async function loadCell(c, file) {
  c.loading = true; c.err = null; renderChips(); const t0 = performance.now();
  try {
    const j = await api(`/api/cell?bc=${c.bc}` + (file ? `&file=${encodeURIComponent(file)}` : '') + (c.ranged ? '&deep=0' : ''));
    Object.assign(c, {data: j, file: j.file, candidates: j.candidates, loading: false});
    status(`${c.bc}: ${j.cycles.length} cycles, ${((performance.now()-t0)/1000).toFixed(2)} s` + (j.parse_s != null ? ` (parsed in ${j.parse_s} s)` : ' (cached)'));
  } catch (e) { c.err = e.message; c.loading = false; status(`${c.bc}: ${e.message}`);
    if (/not found/i.test(e.message)) { cells.splice(cells.indexOf(c), 1); bad.add(`${c.bc} (not found)`); showBad(); renderKw(); } }
  renderChips(); markDirty();
}
NQP.retryCells = () => cells.filter(c => c.err).forEach(c => loadCell(c));   // after the data folder is connected
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const stem = (f) => String(f || '').replace(/\.txt$/i, '');
function channelOf(f) {          // Neware file names end with device-unit-channel(-test ID), e.g. ...-13-3-5-799 or ..._20_10_6
  const n = stem(f); let m = n.match(/(\d+)-(\d+)-(\d+)(?:-(\d+))?$/) || n.match(/(\d+)_(\d+)_(\d+)(?:_(\d+))?$/);
  return m ? {ch: `${m[1]}-${m[2]}-${m[3]}`, test: m[4] || ''} : null;
}
const fmtTime = (ms) => { if (!ms) return ''; const d = new Date(ms), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const ago = (ms) => { const s = (Date.now() - ms) / 1000; return s < 90 ? 'just now' : s < 5400 ? Math.round(s / 60) + ' min ago' : s < 129600 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; };
function renderChips() {
  const box = $('#chips'); box.innerHTML = '';
  for (const c of cells) {
    const d = document.createElement('div'); d.className = 'chip' + (c.err ? ' err' : '');
    d.innerHTML = `<input type="color" value="${c.color}"><span class="nm" title="Click for details">${esc(c.file ? stem(c.file) : c.bc)}</span>
      ${c.loading ? '<span class="meta">loading…</span>' : c.err ? `<span class="meta">${esc(c.err)}</span>` : ''}
      ${c.candidates.length > 1 ? `<span class="nfile" title="${c.candidates.length} files have this barcode; click the name to switch">(${c.candidates.length} files)</span>` : ''}
      <span class="x" title="Remove">✕</span>`;
    $('input[type=color]', d).addEventListener('input', e => { c.color = e.target.value; markDirty(); });
    $('.nm', d).addEventListener('click', ev => { ev.stopPropagation(); showCellInfo(c, ev.currentTarget); });
    $('.x', d).addEventListener('click', () => { cells.splice(cells.indexOf(c), 1); hideCellInfo(); renderChips(); markDirty(); renderKw(); });
    box.appendChild(d);
  }
}
function hideCellInfo() { const p = $('#cellinfo'); if (p) p.remove(); }
function showCellInfo(c, anchor) {
  hideCellInfo();
  const j = c.data || {}, ch = channelOf(c.file), p = document.createElement('div'); p.id = 'cellinfo';
  const row = (k, v) => v ? `<tr><td>${k}</td><td>${v}</td></tr>` : '';
  p.innerHTML = `<table>
    <tr><td>File</td><td class="fn">${esc(c.file || '(not loaded)')}</td></tr>
    ${row('Barcode', esc(c.bc))}
    ${row('Folder', esc(j.dir))}
    ${row('Channel', ch ? esc(ch.ch) + ' <span style="color:var(--muted)">(device-unit-channel, from the file name)</span>' + (ch.test ? ` · test ID ${esc(ch.test)}` : '') : '')}
    ${row('Last updated', j.mtime ? `${fmtTime(j.mtime)} <span style="color:var(--muted)">(${ago(j.mtime)})</span>` : '')}
    ${row('Started', esc(j.start))}
    ${row('Cycles', j.cycles ? String(j.cycles.length) : '')}
    ${row('Size', j.size ? (j.size / 1048576).toFixed(1) + ' MB' : '')}
    ${c.candidates.length > 1 ? row('Other files', `<select>${c.candidates.map(f => `<option ${f === c.file ? 'selected' : ''} value="${esc(f)}">${esc(f)}</option>`).join('')}</select>`) : ''}
  </table>`;
  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect();
  p.style.left = Math.max(8, Math.min(r.left + scrollX, scrollX + innerWidth - p.offsetWidth - 8)) + 'px';
  p.style.top = (r.bottom + scrollY + 6) + 'px';
  const sel = $('select', p); if (sel) sel.onchange = e => { c.userFile = e.target.value; hideCellInfo(); loadCell(c, e.target.value); };

document.addEventListener('click', hideCellInfo);
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCellInfo(); });

// ---------------- file-name search ----------------
const KW = {checked: new Set(), hits: []};
const barcodeOf = (f) => { const m = f.match(/(?<!\d)\d{7}(?!\d)/) || f.match(/(?<!\d)\d{4,9}(?!\d)/); return m ? m[0] : null; };
function renderKw() {
  const q = $('#kw').value.trim(), box = $('#kwbox');
  if (!q) { box.hidden = true; return; }
  if (!NQP.index) { box.hidden = false; $('#kwn').textContent = 'Search works with the local data folder only'; $('#kwlist').innerHTML = ''; return; }
  const words = splitTokens(q.toLowerCase());
  const hits = NQP.index.files().filter(f => { const n = f.name.toLowerCase(); return words.every(w => n.includes(w)); });
  hits.sort((a, b) => (barcodeOf(b.name) || '').localeCompare(barcodeOf(a.name) || '') || a.name.localeCompare(b.name));
  KW.hits = hits; box.hidden = false;
  const st = NQP.index.status(), MAX = 1000;
  $('#kwn').textContent = `${hits.length} file${hits.length === 1 ? '' : 's'} match` + (hits.length > MAX ? ` (showing the first ${MAX})` : '') +
    (st.scanning ? ' · still reading the file list…' : '') + (KW.checked.size ? ` · ${KW.checked.size} selected` : '');
  const re = new RegExp('(' + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  const added = new Set(cells.map(c => c.file).filter(Boolean));
  $('#kwlist').innerHTML = hits.slice(0, MAX).map((f, i) => { const on = added.has(f.name);
    return `<label class="${on ? 'added' : ''}"><input type="checkbox" data-i="${i}" ${on ? 'checked disabled' : KW.checked.has(f.name) ? 'checked' : ''}>
      <span class="nm">${esc(stem(f.name)).replace(re, '<mark>$1</mark>')}</span><span class="dir">${on ? 'added · ' : ''}${esc(f.dir)}</span></label>`; }).join('');
  $('#kwadd').textContent = `Add selected${KW.checked.size ? ' (' + KW.checked.size + ')' : ''}`;
}
$('#kwlist').addEventListener('change', e => { const f = KW.hits[+e.target.dataset.i]; if (!f) return;
  e.target.checked ? KW.checked.add(f.name) : KW.checked.delete(f.name); renderKw(); });
$('#kwselall').onclick = () => { const added = new Set(cells.map(c => c.file)); KW.hits.slice(0, 1000).forEach(f => { if (!added.has(f.name)) KW.checked.add(f.name); }); renderKw(); };
$('#kwnone').onclick = () => { KW.checked.clear(); renderKw(); };
$('#kwclose').onclick = () => { $('#kw').value = ''; KW.checked.clear(); renderKw(); };
$('#kwadd').onclick = () => {
  const skip = [];
  for (const name of KW.checked) {
    const bc = barcodeOf(name); if (!bc) { skip.push(name); continue; }
    const other = cells.find(c => c.bc === bc);
    if (other) { if (other.file !== name) skip.push(`${bc} (already shown with another file)`); continue; }
    const c = {bc, color: nextColor(), file: name, userFile: name, candidates: [], data: null, err: null, loading: true};
    cells.push(c); loadCell(c, name);
  }
  KW.checked.clear(); renderChips(); renderKw();
  if (skip.length) status('Not added: ' + skip.join(', '));
};
let kwT; $('#kw').addEventListener('input', () => { clearTimeout(kwT); kwT = setTimeout(renderKw, 150); });
$('#kw').addEventListener('keydown', e => { if (e.key === 'Escape') $('#kwclose').click(); });
$('#kwall').onchange = e => { if (e.target.checked && NQP.index) NQP.index.readAll(); renderKw(); };

// file-list status (top right) + keep loaded cells up to date when the list changes
function renderIdx() {
  const el = $('#idx'); if (!NQP.index || NQP.source.mode !== 'local') { el.textContent = ''; return; }
  const st = NQP.index.status(); if (!st.connected) { el.textContent = ''; return; }
  el.innerHTML = st.building ? `Building file index… ${st.n.toLocaleString()} files, ${st.secs} s (once only)`
    : `Index: ${st.n.toLocaleString()} files${st.srv ? `, <span title="Built on ${esc(st.srv.host || 'the office PC')} in ${((st.srv.ms || 0) / 1000).toFixed(1)} s; updated twice a day">office PC ${ago(st.srv.t)}</span>` : st.t ? ', ' + ago(st.t) : ''}${st.scanning ? ` <span title="Reading ${st.left} folder(s) again in the background; cells load from the index meanwhile">· updating…</span>` : ` <a href="#" id="idxre" title="Read all ${st.folders} NEWARE folders again">rebuild</a>`}`;
  const a = $('#idxre'); if (a) a.onclick = ev => { ev.preventDefault(); NQP.folder.refresh(0, true); };
}
let idxT, wasScanning = false;
window.addEventListener('nqp-index', () => {
  clearTimeout(idxT); idxT = setTimeout(() => {
    renderIdx(); if ($('#kw').value.trim()) renderKw();
    const st = NQP.index.status();
    if (wasScanning && !st.scanning) for (const c of cells) {       // a read just finished: pick up new / bigger files for loaded cells
      if (!c.data || c.userFile || c.loading) continue;
      const cand = NQP.index.candidates(c.bc);
      if (cand.some(n => !c.candidates.includes(n))) loadCell(c);
    }
    wasScanning = st.scanning;
  }, 200);
});
setInterval(renderIdx, 2000);

// ---------------- signatures (redraw only changed modules) ----------------
function sigOf(m) {
  if (!ON[m.id]) return 'off';
  const s = settings(m);
  return JSON.stringify([s, LIM[m.id], cells.filter(c => c.data).map(c => [c.bc, c.color, c.file])]);
}

// ---------------- data ----------------
function seriesFor(m, s, c) {
  const cy = c.data.cycles, X = [], Y = [];
  let ref = null;
  if (m.y === 'n') { const r = cy.find(e => e.k === +s.ref); if (!r) return null; ref = r.qd; }
  if (m.y === 'dv' && s.dvmode !== 'abs') { const r = cy.find(e => e.k === +s.dvref); if (!r || r.dv == null || (s.dvmode === 'ratio' && !r.dv)) return null; ref = r.dv; }
  for (const e of cy) {
    const x = m.x === 'cyc' ? e.k : e.t_h; if (x == null) continue;
    let y = null;
    if (m.y === 'q') y = s.unit === 'mAh' ? e.qd_mAh : e.qd;
    else if (m.y === 'n') y = 100 * e.qd / ref;
    else if (m.y === 'ce') y = e.ce;
    else if (m.y === 'dv') y = e.dv == null ? null : s.dvmode === 'diff' ? 1000 * (e.dv - ref) : s.dvmode === 'ratio' ? e.dv / ref : e.dv;
    if (y == null || !isFinite(y)) continue;
    X.push(x); Y.push(y);
  }
  return [X, Y];
}
const YLAB = {q: s => s.unit === 'mAh' ? 'Discharge capacity (mAh)' : 'Specific discharge capacity (mAh/g)', n: s => `Capacity vs cycle ${s.ref} (%)`,
              ce: () => 'Coulombic efficiency (%)', dv: s => s.dvmode === 'diff' ? `ΔV − ΔV(${s.dvref}) (mV)` : s.dvmode === 'ratio' ? `ΔV / ΔV(${s.dvref})` : 'ΔV = V̄chg − V̄dis (V)'};

// ---------------- plotting ----------------
// axis limits live on the axes themselves: LIM[module] = {xmin,xmax,ymin,ymax}; null = autoscale
const LIM = {};
function scalesFor(s) {
  const num = (v) => (v == null || !isFinite(v)) ? null : +v;
  const mk = (lo, hi, extra) => {
    if (lo == null && hi == null) return extra;
    return Object.assign({}, extra, {auto: true, range: (u, mn, mx) => {
      if (mn == null || mx == null) { mn = lo ?? 0; mx = hi ?? 1; }
      const lo2 = lo ?? mn, hi2 = hi ?? mx, pad = 0.03 * ((hi2 - lo2) || Math.abs(hi2) || 1);
      return [lo ?? lo2 - pad, hi ?? hi2 + pad]; }});
  };
  return {x: mk(num(s.xmin), num(s.xmax), {time: false}), y: mk(num(s.ymin), num(s.ymax), {})};
}
// editable end values on each axis + an "auto" button next to each axis label
function fmtLim(v, span) {
  if (v == null || !isFinite(v)) return '';
  const d = Math.min(4, Math.max(0, 2 - Math.floor(Math.log10(Math.abs(span) || 1))));

let EXPU = null; const EXPST = {col: {}, lab: {}, fill: false, legend: true};
function today() { const d = new Date(); return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`; }
function expRedraw() { if (EXPU) drawFig($('#expcv'), EXPU, EXPST, 2); }
function openExport(u) {
  if (!u || !u.exp || !u.exp.items.length) { status('Nothing to export'); return; }
  EXPU = u;
  EXPST.col = {}; EXPST.lab = {};
  $('#exptitle').textContent = 'Export PNG · ' + (u.expTitle || u.exp.name);
  $('#explist').innerHTML = u.exp.items.map(i => `<input type="color" data-key="${i.key}" value="${i.color}"><input type="text" data-key="${i.key}" value="${i.label}">`).join('');
  $('#explist').querySelectorAll('input').forEach(inp => inp.oninput = () => {
    (inp.type === 'color' ? EXPST.col : EXPST.lab)[inp.dataset.key] = inp.value; expRedraw(); });
  $('#expfill').checked = EXPST.fill; $('#explegon').checked = EXPST.legend;
  $('#expname').value = `${today()}_${u.exp.name}_${u.exp.kind === 'line' ? '' : u.exp.items.map(i => i.key).join('-')}`.replace(/_$/, '') + '.png';
  $('#exp').showModal(); expRedraw();
}
$('#expfill').onchange = e => { EXPST.fill = e.target.checked; expRedraw(); };
$('#explegon').onchange = e => { EXPST.legend = e.target.checked; expRedraw(); };
$('#expx').onclick = () => $('#exp').close();
$('#expsave').onclick = async () => {
  const cv = document.createElement('canvas'); drawFig(cv, EXPU, EXPST, EXPSCALE);
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  let name = $('#expname').value.trim() || 'plot.png'; if (!/\.png$/i.test(name)) name += '.png';
  try {
    if (window.showSaveFilePicker) {        // Chrome / Edge: asks where to save
      const h = await showSaveFilePicker({suggestedName: name, types: [{description: 'PNG image', accept: {'image/png': ['.png']}}]});
      const w = await h.createWritable(); await w.write(blob); await w.close(); status('Saved ' + h.name); NQP.log('export', {name: EXPU.exp.name});
    } else {                                // other browsers: normal download
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      status('Downloaded ' + name); NQP.log('export', {name: EXPU.exp.name});
    }
    $('#exp').close();
  } catch (err) { if (err.name !== 'AbortError') status('Save failed: ' + err.message); }
};

// ---------------- events ----------------
buildModules(); buildModeBar();
$('#add').onclick = () => { addCells($('#bc').value); $('#bc').value = ''; };
$('#bc').addEventListener('keydown', e => { if (e.key === 'Enter') { addCells($('#bc').value); $('#bc').value = ''; } });
$('#plot').onclick = plotAll;
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
  for (const id in rendered) rendered[id].sig = null; plotAll(); }, 250); });   // redraw so axis boxes re-position
NQP.boot();
</script>
